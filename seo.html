<head>
  <!-- Basic / Essential Technical Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Core Search Engine Optimization Tags -->
  <title>Primary Keyword - Secondary Keyword | Brand Name</title>
  <meta name="description" content="A compelling 150-160 character summary of the page to encourage click-throughs from search results.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.example.com/page-url">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Catchy Title for Social Media Share">
  <meta property="og:description" content="Brief summary tailored for social media feeds.">
  <meta property="og:url" content="https://www.example.com/page-url">
  <meta property="og:image" content="https://www.example.com/images/og-image.jpg">
  <meta property="og:site_name" content="Brand Name">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catchy Title for Twitter">
  <meta name="twitter:description" content="Brief summary tailored for Twitter.">
  <meta name="twitter:image" content="https://www.example.com/images/twitter-image.jpg">

  <!-- Internationalization (Use if site exists in multiple languages) -->
  <link rel="alternate" hreflang="en" href="https://www.example.com/page-url">
  <link rel="alternate" hreflang="es" href="https://www.example.com/es/page-url">
  <link rel="alternate" hreflang="x-default" href="https://www.example.com/page-url">

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Page Title",
    "description": "A brief description of the webpage content."
  }
  </script>
</head>
